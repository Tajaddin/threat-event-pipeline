global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ingest-service:8080"]
        labels: { service: ingest-service }
      - targets: ["enrich-service:8080"]
        labels: { service: enrich-service }
      - targets: ["detect-service:8080"]
        labels: { service: detect-service }
      - targets: ["index-service:8080"]
        labels: { service: index-service }
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
