id: auth-password-spray
title: Password spray from one source
description: Failed logons for fifteen or more distinct users from the same source address within two minutes.
status: stable
level: HIGH
tags: [attack.credential_access, attack.t1110.003]
logsource:
  product: windows
  category: AUTH
detection:
  selection:
    event_code: "4625"
  condition: selection
threshold:
  count: 15
  window: 120s
  groupBy: [src_ip]
  distinct: user
