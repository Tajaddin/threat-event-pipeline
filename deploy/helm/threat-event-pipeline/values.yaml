# The chart deploys the four services and the console. Kafka, Postgres and OpenSearch are external:
# point the endpoints below at your clusters (P9 provisions them with Strimzi, CloudNativePG and the
# OpenSearch operator). Secrets are referenced by name, never inlined.

image:
  registry: ghcr.io/tajaddin
  tag: "0.1.0"
  pullPolicy: IfNotPresent

kafka:
  bootstrapServers: kafka-kafka-bootstrap.kafka.svc:9092

postgres:
  url: jdbc:postgresql://threat-rw.threat.svc:5432/threat
  user: threat
  # name of a Secret with key `password`
  existingSecret: threat-postgres

opensearch:
  url: http://opensearch-cluster-master.opensearch.svc:9200

# the console's nginx resolves upstreams itself and does not use the pod's DNS search path, so it needs
# fully qualified service names
clusterDomain: cluster.local

ingest:
  replicas: 2
  # name of a Secret with key `apiKeys` (comma-separated X-API-Key values); required: the pod does not
  # start without the Secret, and ingest refuses to start when it holds no key
  apiKeysSecret: threat-ingest-keys
  rateLimitPerMinute: 600000
  resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 768Mi } }

enrich:
  # each pod's transactional id prefix includes its pod name, so replicas never fence each other
  replicas: 2
  concurrency: 3
  resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 768Mi } }

detect:
  # One replica. Threshold windows live in each instance's memory and events are partitioned by source
  # address, so a rule that groups by another field (lateral movement groups by user) would under-count
  # across replicas; see the README's Limitations. Scale with `concurrency` (up to the partition count).
  replicas: 1
  concurrency: 3
  # name of a Secret with key `apiKey`: detect requires it in X-API-Key, and the console's proxy sends it;
  # required in the same way as ingest's
  apiKeySecret: threat-detect-key
  corsOrigins: "https://console.example.com"
  resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 768Mi } }
  # extra rules mounted at /rules; keys are file names
  rules: {}

index:
  replicas: 1
  concurrency: 2
  resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 768Mi } }

console:
  replicas: 1
  # Prometheus for the pipeline tab's rates and lag (kube-prometheus-stack's service by default)
  prometheusUrl: http://prometheus-operated.monitoring.svc.cluster.local:9090
  resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 128Mi } }

ingress:
  # The console has no login of its own and its proxy holds detect's key: expose it only behind an
  # authenticating proxy (for example oauth2-proxy through the ingress controller's auth annotations).
  enabled: false
  className: nginx
  host: console.example.com
  tls: false

serviceMonitor:
  # creates Prometheus Operator ServiceMonitors (kube-prometheus-stack)
  enabled: false
  labels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile: { type: RuntimeDefault }

networkPolicy:
  enabled: true
