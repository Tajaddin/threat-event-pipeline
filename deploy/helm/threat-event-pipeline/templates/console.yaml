apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-console
  labels:
    {{- include "tep.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  replicas: {{ .Values.console.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        {{- include "tep.labels" . | nindent 8 }}
        app.kubernetes.io/component: console
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: console
          image: {{ include "tep.image" (dict "Values" .Values "component" "console") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- $svc := printf "%s.svc.%s:8080" .Release.Namespace .Values.clusterDomain }}
            - name: DETECT_UPSTREAM
              value: {{ printf "http://%s-detect-service.%s" .Release.Name $svc | quote }}
            - name: INGEST_UPSTREAM
              value: {{ printf "http://%s-ingest-service.%s" .Release.Name $svc | quote }}
            - name: PROMETHEUS_UPSTREAM
              value: {{ .Values.console.prometheusUrl | quote }}
            - name: DETECT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "detect.apiKeySecret must name a Secret with key apiKey" .Values.detect.apiKeySecret }}
                  key: apiKey
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            # the image's entrypoint renders the nginx config here at start-up; nginx keeps its pid and
            # temporary files in /tmp
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: conf
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-console
  labels:
    {{- include "tep.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: console
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-console
  labels:
    {{- include "tep.labels" . | nindent 4 }}
  {{- if .Values.ingress.tls }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Release.Name }}-console-tls
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-console
                port: { name: http }
{{- end }}
