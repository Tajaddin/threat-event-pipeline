# The whole pipeline on one machine. `docker compose up -d --build` starts Kafka (KRaft), Postgres, OpenSearch
# with Dashboards, the four services and the console; `--profile observability` adds Prometheus (with
# kafka-exporter for consumer lag), Alertmanager and Grafana. Copy .env.example to .env first.

name: threat

x-service: &service
  restart: unless-stopped
  environment: &service-env
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    POSTGRES_URL: jdbc:postgresql://postgres:5432/threat
    POSTGRES_USER: threat
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-threat}
    OPENSEARCH_URL: http://opensearch:9200
    SERVER_PORT: "8080"
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+UseG1GC
  depends_on:
    kafka-init:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy

services:
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xmx768m -Xms768m
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-threat-event-pipeline-01}
    ports:
      - "${KAFKA_PORT:-29092}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for t in events.raw:6 events.enriched:6 events.dlq:1 alerts:3; do
          name=$${t%%:*}; parts=$${t##*:}
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$name --partitions $$parts --replication-factor 1 --config retention.ms=86400000
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: threat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-threat}
      POSTGRES_DB: threat
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threat -d threat"]
      interval: 5s
      timeout: 3s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.19.6
    environment:
      discovery.type: single-node
      cluster.name: threat
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: -Xms${OPENSEARCH_HEAP:-1g} -Xmx${OPENSEARCH_HEAP:-1g}
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.6
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "${DASHBOARDS_PORT:-5601}:5601"
    depends_on:
      opensearch:
        condition: service_healthy

  ingest-service:
    <<: *service
    build:
      context: .
      args: { MODULE: ingest-service }
    image: threat/ingest-service:local
    environment:
      <<: *service-env
      INGEST_API_KEYS: ${INGEST_API_KEYS:-}
      INGEST_RATE_LIMIT_PER_MINUTE: ${INGEST_RATE_LIMIT_PER_MINUTE:-600000}
    ports:
      - "${INGEST_PORT:-8081}:8080"

  enrich-service:
    <<: *service
    build:
      context: .
      args: { MODULE: enrich-service }
    image: threat/enrich-service:local
    environment:
      <<: *service-env
      ENRICH_CONCURRENCY: ${ENRICH_CONCURRENCY:-3}
    ports:
      - "${ENRICH_PORT:-8082}:8080"

  detect-service:
    <<: *service
    build:
      context: .
      args: { MODULE: detect-service }
    image: threat/detect-service:local
    environment:
      <<: *service-env
      DETECT_CONCURRENCY: ${DETECT_CONCURRENCY:-3}
      DETECT_CORS_ORIGINS: http://localhost:${CONSOLE_PORT:-4200},http://localhost:4200
      DETECT_RULES_DIR: /rules
    volumes:
      - ./rules:/rules:ro
    ports:
      - "${DETECT_PORT:-8083}:8080"

  index-service:
    <<: *service
    build:
      context: .
      args: { MODULE: index-service }
    image: threat/index-service:local
    environment:
      <<: *service-env
      INDEX_CONCURRENCY: ${INDEX_CONCURRENCY:-2}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy
    ports:
      - "${INDEX_PORT:-8084}:8080"

  console:
    build:
      context: ./console
    image: threat/console:local
    ports:
      - "${CONSOLE_PORT:-4200}:80"
    depends_on: [detect-service, ingest-service]
    restart: unless-stopped

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.10.0
    profiles: [observability]
    command: ["--kafka.server=kafka:9092", "--group.filter=.*", "--topic.filter=.*"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_EXPORTER_PORT:-9308}:9308"

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d", "--web.enable-remote-write-receiver"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9093}:9090"

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: [observability]
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "${ALERTMANAGER_PORT:-9096}:9093"

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3004}:3000"
    depends_on: [prometheus]

volumes:
  kafka-data:
  pgdata:
  opensearch-data:
  prometheus-data:
  grafana-data:
